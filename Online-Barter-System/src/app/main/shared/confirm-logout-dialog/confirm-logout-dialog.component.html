<div class="hero">
<h2 mat-dialog-title>Confirm Logout</h2>
<mat-dialog-content>
  <p>Are you sure you want to log out?</p>
</mat-dialog-content>
</div>
<mat-dialog-actions>

  <button class="logout" (click)="onConfirm()">Logout</button>
</mat-dialog-actions>
