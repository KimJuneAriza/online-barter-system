<app-spinner [show]="loading"></app-spinner>
<div class="main">
<div class="profile-container">
    <h2 class="profile-title">Complete Your Profile</h2>
  
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">

      <div class="form-control">
        <label for="full_name" class="form-label">Full Name</label>
        <input type="text" 
          id="full_name"
          formControlName="full_name" placeholder="ex. Juan De la Cruz" class="form-input" />

          <div class="error" *ngIf="full_name?.hasError('required') && full_name?.touched">
            * full name is required.
          </div>
      </div>

      <div class="form-control">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="number"
        id="phone" 
        formControlName="phone" placeholder="ex. 09123456789" class="form-input" />

        <div class="error" *ngIf="phone?.hasError('required') && phone?.touched">
          * phone number is required.
        </div>
      </div>
      
      <div class="form-control">
        <label for="gender" class="form-label">Gender</label>
        <select formControlName="gender" id="gender" class="form-input">
          <option value="" disabled selected>Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>

        <div class="error" *ngIf="gender?.hasError('required') && gender?.touched">
          * gender is required.
        </div>
      </div>

      <div class="form-control">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" id="dob" formControlName="dob" class="form-input" />
        <div class="error" *ngIf="dob?.hasError('required') && dob?.touched">
          * date of birth is required.
        </div>
      </div>

      <div class="form-control">
        <label for="address" class="form-label">Address</label>
        <textarea formControlName="address" 
        id="address"
        placeholder="Address" class="form-input"></textarea>

        <div class="error" *ngIf="address?.hasError('required') && address?.touched">
          * address is required.
        </div>
      </div>
  
      <div>
      <div class="file-input">
        <input type="file" id="file" (change)="onFileChange($event)" (blur)="onBlur()" hidden />
        <label for="file" class="fileButton">Choose Profile Picture</label>
        <span class="filename">{{ selectedFile?.name || 'no file chosen' }}</span>
      </div>
      <div class="error" *ngIf="fileTouched && showError">Please choose a file.</div>
    </div>
      
  
    <button type="submit"
    [disabled]="profileForm.invalid || !selectedFile?.name"
    [ngClass]="{
      'submit-btn': true,
      'disabled-button': profileForm.invalid || !selectedFile?.name
    }">
    Save Profile
  </button>
  
    </form>
  </div>
</div>
